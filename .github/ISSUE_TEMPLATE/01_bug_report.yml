name: ?? Bug Report
description: Report a bug, crash, or unexpected behavior in AutoHeal-QA
title: "[Bug]: <Brief summary of the issue>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please do not paste proprietary credentials or secret URLs.
  - type: input
    id: versions
    attributes:
      label: Playwright, Node.js & OS Versions
      placeholder: e.g. Playwright 1.50.1, Node v22.12.0, Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command Executed
      placeholder: e.g. npx autoheal run tests/login.spec.ts --ollama
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. Create test with locator '...'
        2. Change UI button attribute to '...'
        3. Run autoheal
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stack Trace
      placeholder: Paste the terminal error output or stack trace.
      render: shell
    validations:
      required: false
